# Development stack with each role as its own service, as in production.
# Needs ./web-dist from the repo root and MEDIA_DIR pointing at a media folder.
name: jellyscale

x-app: &app
  build: ../..
  environment:
    JELLYSCALE_DATABASE_URL: postgres://postgres:dev@postgres:5432/postgres
    JELLYSCALE_ADMIN_PASSWORD: ${JELLYSCALE_ADMIN_PASSWORD:?set an admin password}
    # Only needed for s3:// libraries. Empty is passed through as unset.
    JELLYSCALE_S3_ACCESS_KEY: ${JELLYSCALE_S3_ACCESS_KEY:-}
    JELLYSCALE_S3_SECRET_KEY: ${JELLYSCALE_S3_SECRET_KEY:-}
  volumes:
    - ./config.json:/etc/jellyscale/config.json:ro
    - ${MEDIA_DIR:?set MEDIA_DIR}:/media:ro
    - assets:/assets
    - transcode:/transcode
    - ../../web-dist:/web:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: dev
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      retries: 30

  assets-init:
    image: alpine:3.22
    command: chown 1000:1000 /assets /transcode
    volumes:
      - assets:/assets
      - transcode:/transcode

  api:
    <<: *app
    command: [--roles=api, --config=/etc/jellyscale/config.json]

  stream:
    <<: *app
    command: [--roles=stream, --config=/etc/jellyscale/config.json]

  # Second replicas, so that one can be rolled or lost while the other serves (see the Caddyfile).
  api2:
    <<: *app
    command: [--roles=api, --config=/etc/jellyscale/config.json]

  stream2:
    <<: *app
    command: [--roles=stream, --config=/etc/jellyscale/config.json]

  # Routes /Videos/, /Items/*/Images/, /Items/*/Download and /Playback/BitrateTest to stream and the rest to api.
  ingress:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 127.0.0.1:8096:8080
    # config.json leaves "trustedProxies" out, so the per-address sign-in bound is off here: this port is published on
    # 127.0.0.1 only, so Docker hands every client to Caddy from the bridge gateway, and declaring Caddy would count that one
    # address for everyone. Declare the ingress ("trustedProxies": ["<its address>"] in config.json) only when each client
    # reaches it with its own address; the ingress needs a fixed address that survives its being recreated, or declare its
    # network's prefix (docs/running.md).
    depends_on:
      - api
      - api2
      - stream
      - stream2

  worker:
    <<: *app
    command: [--roles=worker, --config=/etc/jellyscale/config.json]

volumes:
  postgres:
  assets:
  transcode:
