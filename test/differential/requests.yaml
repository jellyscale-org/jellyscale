# The requests the differential tier sends to both servers (test/differential/run.sh).
# route is the endpoint template, path the request line as jellyfin-web sends it.
# {{Type/Name}} is the id a server gave that item; ordered says the route promises
# an order, so arrays are compared in order. Name only the synthetic fixtures
# (test/fixtures/make.sh). See docs/testing.md to add one.
- name: the signed-in user
  route: GET /Users/Me
  method: GET
  ordered: true
  path: >-
    /Users/Me
- name: the home page views
  rows: true
  route: GET /UserViews
  method: GET
  ordered: true
  path: >-
    /UserViews?userId={{User/admin}}
- name: latest films in the Movies library
  rows: true
  route: GET /Items/Latest
  method: GET
  path: >-
    /Items/Latest?userId={{User/admin}}&ParentId={{CollectionFolder/Movies}}&Limit=16&Fields=PrimaryImageAspectRatio,BasicSyncInfo,MediaSourceCount,ProductionYear,Overview,Genres,Taglines&ImageTypeLimit=1&EnableImageTypes=Primary,Backdrop,Thumb
- name: latest in the Shows library
  rows: true
  route: GET /Items/Latest
  method: GET
  path: >-
    /Items/Latest?userId={{User/admin}}&ParentId={{CollectionFolder/Shows}}&Limit=16&Fields=PrimaryImageAspectRatio,BasicSyncInfo,MediaSourceCount,ProductionYear,Overview,Genres,Taglines&ImageTypeLimit=1&EnableImageTypes=Primary,Backdrop,Thumb
- name: continue watching, Video
  rows: true
  route: GET /UserItems/Resume
  method: GET
  ordered: true
  path: >-
    /UserItems/Resume?userId={{User/admin}}&Limit=12&Fields=PrimaryImageAspectRatio,BasicSyncInfo,MediaSourceCount,ProductionYear,Overview,Genres,Taglines&ImageTypeLimit=1&EnableImageTypes=Primary,Backdrop,Thumb&EnableTotalRecordCount=false&mediaTypes=Video
- name: continue watching, Audio
  route: GET /UserItems/Resume
  method: GET
  ordered: true
  path: >-
    /UserItems/Resume?userId={{User/admin}}&Limit=12&Fields=PrimaryImageAspectRatio,BasicSyncInfo,MediaSourceCount,ProductionYear,Overview,Genres,Taglines&ImageTypeLimit=1&EnableImageTypes=Primary,Backdrop,Thumb&EnableTotalRecordCount=false&mediaTypes=Audio
- name: continue watching, Book
  route: GET /UserItems/Resume
  method: GET
  ordered: true
  path: >-
    /UserItems/Resume?userId={{User/admin}}&Limit=12&Fields=PrimaryImageAspectRatio,BasicSyncInfo,MediaSourceCount,ProductionYear,Overview,Genres,Taglines&ImageTypeLimit=1&EnableImageTypes=Primary,Backdrop,Thumb&EnableTotalRecordCount=false&mediaTypes=Book
- name: the films library, by name
  rows: true
  route: GET /Items
  method: GET
  path: >-
    /Items?userId={{User/admin}}&SortBy=SortName,ProductionYear&SortOrder=Ascending&IncludeItemTypes=Movie&Recursive=true&Fields=PrimaryImageAspectRatio,BasicSyncInfo,MediaSourceCount,ProductionYear,Overview,Genres,Taglines&ImageTypeLimit=1&EnableImageTypes=Primary,Backdrop,Banner,Thumb&StartIndex=0&Limit=100
  ordered: true
- name: the films library, newest first
  rows: true
  route: GET /Items
  method: GET
  path: >-
    /Items?userId={{User/admin}}&ParentId={{CollectionFolder/Movies}}&SortBy=PremiereDate,SortName&SortOrder=Descending&IncludeItemTypes=Movie&Recursive=true&Fields=PrimaryImageAspectRatio,BasicSyncInfo,MediaSourceCount,ProductionYear,Overview,Genres,Taglines&Limit=100
  ordered: true
- name: the shows library, by name
  rows: true
  route: GET /Items
  method: GET
  path: >-
    /Items?userId={{User/admin}}&SortBy=SortName&SortOrder=Ascending&IncludeItemTypes=Series&Recursive=true&Fields=PrimaryImageAspectRatio,BasicSyncInfo,MediaSourceCount,ProductionYear,Overview,Genres,Taglines&Limit=100
  ordered: true
- name: search
  rows: true
  route: GET /Items
  method: GET
  path: >-
    /Items?userId={{User/admin}}&searchTerm=film&Limit=24&Recursive=true&IncludeItemTypes=Movie,Series,Episode&Fields=PrimaryImageAspectRatio,BasicSyncInfo,MediaSourceCount,ProductionYear,Overview,Genres,Taglines
- name: a film's details
  route: GET /Items/{itemId}
  method: GET
  ordered: true
  path: >-
    /Items/{{Movie/Alpha Film (2021)}}?userId={{User/admin}}
- name: an episode's details
  route: GET /Items/{itemId}
  method: GET
  ordered: true
  path: >-
    /Items/{{Episode/Delta Show S01E01 Pilot}}?userId={{User/admin}}
- name: a show's details
  route: GET /Items/{itemId}
  method: GET
  ordered: true
  path: >-
    /Items/{{Series/Delta Show}}?userId={{User/admin}}
- name: the seasons of a show
  rows: true
  route: GET /Shows/{seriesId}/Seasons
  method: GET
  path: >-
    /Shows/{{Series/Delta Show}}/Seasons?userId={{User/admin}}&Fields=PrimaryImageAspectRatio,BasicSyncInfo,MediaSourceCount,ProductionYear,Overview,Genres,Taglines
  ordered: true
- name: the episodes of a show
  rows: true
  route: GET /Shows/{seriesId}/Episodes
  method: GET
  path: >-
    /Shows/{{Series/Delta Show}}/Episodes?userId={{User/admin}}&Fields=PrimaryImageAspectRatio,BasicSyncInfo,MediaSourceCount,ProductionYear,Overview,Genres,Taglines
  ordered: true
