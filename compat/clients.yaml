        - {method: GET, route: /Shows/NextUp, auth: mediabrowser, from: source, query: {userId: ["{userId}"], limit: ["50"], imageTypeLimit: ["1"], enableTotalRecordCount: ["false"]}}
        - {method: GET, route: /Items/Latest, auth: mediabrowser, from: source, query: {userId: ["{userId}"], parentId: ["{parentId}"], limit: ["50"], imageTypeLimit: ["1"]}}
      browse:
