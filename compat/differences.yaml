    - "cors: preflight asking DELETE"
    - "cors: preflight asking PATCH"
    - "cors: preflight asking a header outside the six"
    - "cors: preflight of an unserved path"
  kind: improvement
  reason: "an OPTIONS with no Origin is no preflight and jellyscale answers it with the catch-all's 404 where Jellyfin says 405; a preflight asking a method the path does not serve, or of a path nothing serves, is answered 404 (which a browser refuses) where Jellyfin allows whatever is asked: the page is told what the path serves, not what it asked for"
  paths:
