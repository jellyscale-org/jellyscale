  kind: non-goal
  reason: "PRODUCT.md leaves out deleting media, Live TV, media conversion and public sharing, so jellyscale reports them as not allowed"
  paths:
    - "Items[].CanDelete"

- requests:
    - "the home page views"
  kind: gap
  task: JS-068
  reason: "flags and counters Jellyfin always sends (IgnoreDts, RequiresLooping, UnplayedItemCount, MediaType Unknown and the like) that jellyscale leaves out, or computes differently"
  paths:
    - "Items[].CanDownload"
    - "Items[].ChannelId"
    - "Items[].Chapters"
    - "Items[].ChildCount"
    - "Items[].DateCreated"
    - "Items[].DateLastMediaAdded"
    - "Items[].Etag"
    - "Items[].MediaType"
    - "Items[].ParentId"

