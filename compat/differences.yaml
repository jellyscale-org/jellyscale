# Where jellyscale answers differently from Jellyfin 12.4 in the differential tier
# (test/differential/run.sh). Each entry names the requests (by name, in
# test/differential/requests.yaml) it applies to and the JSON paths below them, with
# [] for any array index, and why the difference is allowed. An entry hides nothing in
# any other request, even one to the same route, and a name that is no request fails the
# tier. kind is improvement (better than Jellyfin), non-goal (PRODUCT.md leaves it out)
# or gap (to close, with the task in tasks/prd.json). A difference not listed here fails
# the tier; an entry that no longer matches in a request is reported, so remove it. A
# path ending in "(ids)" is which items a listing holds, and in what order when the
# request is ordered; it must pin the Ids jellyscale answers today (jellyscale:), so a
# dropped, extra or reordered item is a new difference even where every field is listed.
# See docs/testing.md.

- requests:
    - "the signed-in user"
  kind: gap
  task: JS-033
  reason: "user management: provider ids, a hidden flag and a cast receiver id that Jellyfin keeps for each user and jellyscale does not"
  paths:
    - "Configuration.CastReceiverId"
    - "Policy.AuthenticationProviderId"
    - "Policy.IsHidden"
    - "Policy.PasswordResetProviderId"

- requests:
    - "the signed-in user"
  kind: non-goal
  reason: "PRODUCT.md leaves out deleting media, Live TV, media conversion and public sharing, so jellyscale reports them as not allowed"
  paths:
    - "Policy.EnableContentDeletion"
    - "Policy.EnableLiveTvAccess"
    - "Policy.EnableMediaConversion"
    - "Policy.EnablePublicSharing"

- requests:
    - "the signed-in user"
  kind: gap
  task: JS-063
  reason: "SyncPlay is not built, so a user can join no group"
  paths:
    - "Policy.SyncPlayAccess"

- requests:
