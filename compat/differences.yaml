- requests:
    - "cors: open route"
    - "cors: viewer route with a token"
    - "cors: viewer route with no token"
    - "cors: ranged film"
    - "cors: GET of an unserved path"
  kind: improvement
  reason: "jellyscale lists Content-Range, Accept-Ranges and Content-Length in Access-Control-Expose-Headers, so a page on another origin can read a ranged answer; Jellyfin exposes none"
  paths:
