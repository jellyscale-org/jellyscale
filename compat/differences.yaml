# internal/api/subtitles_default_integration_test.go, not asked of two servers by the differential tier, so none of the names
# is a request of requests.yaml. A cell of the capture where jellyscale answers another track is listed here by its own name,
# "subtitle default: <film> | <mode> | <language>", and a cell it answers as captured must not be.
- requests:
    - "subtitle default: named 99"
  kind: improvement
  reason: "a SubtitleStreamIndex that names no stream is answered -1 here; Jellyfin 12.4 answers the number it was sent, which jellyfin-web then reads as a position past the end of MediaStreams and draws no subtitle for (compat/captures/subtitles-default-12.4.md)"
  paths:
    - "MediaSources[].DefaultSubtitleStreamIndex"

- requests:
    - "subtitle default: named with no profile"
  kind: improvement
  reason: "a request with no DeviceProfile that names a subtitle track is answered that track here, whatever the viewer's mode; Jellyfin 12.4 ignores the track named when the request has no profile and answers the mode's default (compat/captures/subtitles-default-12.4.md)"
  paths:
    - "MediaSources[].DefaultSubtitleStreamIndex"

- requests:
    - "subtitle default: a viewer who never saved a Configuration"
  kind: improvement
  reason: "a viewer who has never posted a Configuration is answered no default subtitle here, so no viewer is started on a subtitle they never chose; Jellyfin 12.4's new user is SubtitleMode Default with no language and is answered that mode's default without saving anything. A viewer who saves Default and no language is answered as Jellyfin answers (compat/captures/subtitles-default-12.4.md)"
  paths:
    - "MediaSources[].DefaultSubtitleStreamIndex"

- requests:
    - "quick connect: approve an approved code again"
    - "quick connect: another account approves an approved code"
    - "quick connect: approve after redemption"
  kind: improvement
  reason: "approving an already approved code, redeemed or not, is a conflict with the code's state and is answered 409 here; Jellyfin 12.4 answers 500, which reads as a server fault. jellyfin-web 12.4 shows both alike, Unknown Quick Connect code (compat/captures/quick-connect-second-approval-12.4.md)"
  paths:
    - "(status)"

# JS-037: approval is always for the account that is signed in, administrators included (D-082). Jellyfin lets an
# administrator sign a device into somebody else's account by naming them; Jellyscale refuses that naming with 403,
# leaves the code pending and never issues the other account's token.
- requests:
    - "quick connect: administrator names another user"
    - "quick connect: administrator names a user nobody is"
    - "quick connect: viewer names a malformed userId"
  kind: improvement
  reason: "naming anyone but the approver is refused 403 here, whether the id is another account, nobody's, or malformed; Jellyfin 12.4 answers 200 for an administrator naming another account and 400 for the other two (JS-037, D-082)"
  paths:
    - "(status)"

- requests:
    - "quick connect: connect after the administrator named another"
  kind: improvement
  reason: "the refused approval left this code pending, so its poll still says not approved; Jellyfin's administrator approval made it approved (JS-037)"
  paths:
    - "body.Authenticated"

- requests:
    - "quick connect: redeem the approval naming another"
  kind: improvement
  reason: "no approval for the other account happened, so there is no sign-in to give this device; Jellyfin hands out the other account's token (JS-037)"
  paths:
    - "(status)"

- requests:
    - "quick connect: redeem after the approver is deleted"
  kind: improvement
  reason: "an account deleted after it approved redeems nothing: there is no account to sign the device into, so the device gets the unknown-secret answer; Jellyfin 12.4 answers with a 200 sign-in whose token then answers 401 (JS-037)"
  paths:
    - "(status)"

# JS-033: where user management answers otherwise than compat/captures/users-admin-12.4.md. cmd/jellyscale's users checks
# hold these, not the differential tier, so none of the names is a request of requests.yaml.
- requests:
    - "users: a viewer lists the users"
  kind: improvement
  reason: "a viewer's GET /Users holds only their own account; Jellyfin 12.4 gives a viewer every account (D-075, D-096)"
  paths:
    - "body"

- requests:
    - "users: the list filtered by isHidden"
  kind: non-goal
  reason: "no account is hidden, so isHidden=true lists nobody and isHidden=false everybody (D-093)"
  paths:
    - "body"

- requests:
    - "users: new user with no Password"
    - "users: new user with an empty Password"
  kind: improvement
  reason: "the account is made with no password, and every password sign-in for it, the empty one included, gets a wrong password's 401 until an administrator sets one; Jellyfin 12.4 signs it in with the empty password (D-105)"
  paths:
    - "(status of the sign-in)"

- requests:
    - "users: new user with a commonly guessed password"
    - "users: a commonly guessed new password"
    - "users: an empty new password"
  kind: improvement
  reason: "a new or changed password that is empty or on the shipped list of commonly guessed ones is 400 with the reason, and one over 72 bytes too; Jellyfin 12.4 stores it. A user made with no or an empty Password is not refused (D-100, D-103)"
  paths:
    - "(status)"

- requests:
    - "users: reset of one's own password"
  kind: improvement
  reason: "resetting your own password is refused for everyone, with or without CurrentPw, and changes nothing; Jellyfin 12.4 answers 204 (D-103)"
  paths:
    - "(status)"

- requests:
    - "users: an administrator resets another's password"
  kind: improvement
  reason: "the account is left with no password that signs in, the empty one included, and its tokens end; Jellyfin 12.4 keeps the tokens and takes the empty password (D-103)"
  paths:
    - "(tokens)"
    - "(status of the sign-in)"

- requests:
    - "users: a user with no password changes their own"
  kind: improvement
  reason: "an account with no password has no current password to prove, so its own change is refused 403 until an administrator sets one; Jellyfin 12.4 takes it with no or an empty CurrentPw (D-105)"
  paths:
    - "(status)"

- requests:
    - "users: a disabled account signs in"
  kind: improvement
  reason: "a disabled account's sign-in is answered as a wrong password is, 401, and the log names the reason; Jellyfin 12.4 answers 403 (D-096)"
  paths:
    - "(status)"

- requests:
    - "users: an administrator is disabled"
  kind: improvement
  reason: "an administrator may be disabled, by themselves too, while another enabled administrator remains; Jellyfin 12.4 refuses every administrator (D-095)"
  paths:
    - "(status)"

- requests:
    - "users: the last administrator deletes themselves"
  kind: improvement
  reason: "403, and nothing changes; Jellyfin 12.4 answers 400 after it has ended the caller's token"
  paths:
    - "(status)"
    - "(tokens)"

- requests:
    - "users: an administrator names the zero id"
  kind: improvement
  reason: "an administrator naming the zero id gets the 404 of an id nobody has (JS-127); Jellyfin 12.4 answers 400"
  paths:
    - "(status)"

- requests:
    - "users: a Policy body without every field"
  kind: improvement
  reason: "a Policy changes only the fields its body names, and the two provider ids are optional; Jellyfin 12.4 refuses a body without the ids and resets every other missing field (D-094)"
  paths:
    - "(status)"
    - "Policy"

- requests:
    - "users: a Policy that changes a field that is not enforced"
  kind: non-goal
  reason: "only IsAdministrator, IsDisabled and EnableContentDownloading are stored; a change to any other field is 400 naming each, stores nothing and is logged, where Jellyfin 12.4 stores it. null where the Policy answers an empty list is no change (D-093)"
  paths:
    - "(status)"
    - "Policy"

- requests:
    - "users: a Policy that names a channel field"
  kind: non-goal
  reason: "no channels exist: any value of EnableAllChannels, EnabledChannels and BlockedChannels is accepted and not stored (D-093)"
  paths:
    - "Policy.EnableAllChannels"
    - "Policy.EnabledChannels"
    - "Policy.BlockedChannels"

- requests:
    - "users: failed sign-ins and the lockout fields"
  kind: non-goal
  reason: "no account is disabled by failed sign-ins: LoginAttemptsBeforeLockout stays -1 and InvalidLoginAttemptCount 0, and a Policy changing either is 400 (D-020, D-093)"
  paths:
    - "(status)"
    - "Policy.LoginAttemptsBeforeLockout"
    - "Policy.InvalidLoginAttemptCount"

- requests:
    - "users: a rename with only a Name"
  kind: improvement
  reason: "POST /Users takes a body with a Name and no Configuration or Policy; Jellyfin 12.4 requires the whole user"
  paths:
    - "(status)"

- requests:
    - "users: the configured administrator is deleted or renamed"
  kind: improvement
  reason: "while the adminUser key names the account, deleting or renaming it is 403 naming the key; Jellyfin has no configured account (D-095)"
  paths:
    - "(status)"

- requests:
    - "users: the lists the user pages read"
  kind: non-goal
  reason: "GET /Channels and GET /Localization/ParentalRatings are valid empty lists; GET /Library/MediaFolders holds the libraries and GET /Devices each signed-in device's id, name, app, version, last user and last sign-in, with empty Capabilities, for administrators"
  paths:
    - "body"
