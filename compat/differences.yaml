  reason: "jellyscale refuses failed sign-ins temporarily, per name (20 in 15 minutes from devices new to the account), per known device and per address, with 403 and Retry-After, where Jellyfin 12.4 has no bound by default (D-020, compat/captures/signin-12.4.md)"
  paths:
