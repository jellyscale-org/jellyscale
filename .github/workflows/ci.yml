name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled, so adding ci:full to a pull request starts its full run.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue tests each pull request on top of main and what is queued
  # before it; the required checks must report there too.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three checks are required by branch protection: lint-and-unit, integration and
# e2e. They report on every pull request. integration and e2e are the last jobs
# of a fan-out: their shards (the "integration shard" and "e2e shard" jobs) run
# the tests side by side, and the job named integration or e2e fails if any shard
# failed or was cancelled, or if the shards did not add up to every test and
# scenario (test/check-shards.sh).
#
# The media tiers (the shards) run once per change, in the merge queue, which
# tests the exact commit that lands. A pull request runs lint-and-unit, and its
# integration and e2e checks pass at once saying so; the label ci:full runs the
# media tiers on the pull request too. A merge group or a ci:full pull request
# that changes only docs or tasks/prd.json skips them (test/changes.sh). A push
# to main was tested in its merge group: it runs lint-and-unit and refills the
# e2e fixture cache, which only main's scope shares with every branch.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      why: ${{ steps.diff.outputs.why }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          code=true why=""
          case $GITHUB_EVENT_NAME in
          pull_request)
            if [ "$FULL" != true ]; then
              code=false why="a pull request: the media tiers run in the merge queue (label ci:full runs them here)"
            elif [ "$(bash test/changes.sh "$PR_BASE...$PR_HEAD")" = docs-only ]; then
              code=false why="only docs or tasks/prd.json changed"
            fi ;;
          merge_group)
            if [ "$(bash test/changes.sh "$QUEUE_BASE" "$QUEUE_HEAD")" = docs-only ]; then
              code=false why="only docs or tasks/prd.json changed"
            fi ;;
          push) code=false why="a push to main, tested in its merge group" ;;
          esac
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "why=$why" >> "$GITHUB_OUTPUT"
          echo "media tiers: $code${why:+ ($why)}"

  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal test)"
      - run: go vet ./...
      # The integration tier has a build tag; vet type-checks it and the second
      # command links its test binaries, so a tagged file can't rot unseen.
      - run: go vet -tags integration ./...
      - run: go test -tags integration -count=1 -run '^$' ./...
      - name: Tests that need nothing outside Go
        run: bash test/unit.sh
        env:
          JELLYSCALE_LOG_DIR: ${{ runner.temp }}/logs
      - name: Tests of the test scripts (shards, fixture cache, results)
        run: bash test/scripts_test.sh
      - name: Route manifest is current
        run: |
          go run ./cmd/jellyscale --print-routes > /tmp/endpoints.yaml
          diff compat/endpoints.yaml /tmp/endpoints.yaml
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

  # How many tests the integration tier has, from the compiler, for the job
  # that checks the shards ran them all.
  integration-total:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.count.outputs.total }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: count
        run: echo "total=$(go test -tags integration -list '.*' ./... 2>/dev/null | grep -cE '^(Test|Example|Fuzz)')" >> "$GITHUB_OUTPUT"

  # Everything the integration tier needs is installed here, so a test that
  # can't run fails, and test/report.sh fails the job if any test is skipped.
  # internal/transcode holds most of the time and is dealt out in three; the
  # fourth shard is every other package (test/shard.sh).
  integration-shard:
    name: integration shard (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # The tests' own limit is 20, set in test/integration.sh.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 0of3, shard: 0/3 }
          - { name: 1of3, shard: 1/3 }
          - { name: 2of3, shard: 2/3 }
          - { name: rest, shard: rest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # ffmpeg from Ubuntu has libx264, libx265, libsvtav1 and libass; burn-in needs a font.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
      - run: bash test/integration.sh
        env:
          INTEGRATION_SHARD: ${{ matrix.shard }}
          JELLYSCALE_LOG_DIR: ${{ runner.temp }}/logs
      - uses: actions/upload-artifact@v7
        with:
          name: integration-shard-${{ matrix.name }}
          path: ${{ runner.temp }}/logs/shard-*.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/logs

  # The required check "integration". It passes when every shard passed and
  # they ran every test between them, or when the shards did not run (see changes).
  integration:
    needs: [changes, integration-total, integration-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - id: decide
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WHY: ${{ needs.changes.outputs.why }}
          TOTAL: ${{ needs.integration-total.result }}
          SHARDS: ${{ needs.integration-shard.result }}
        run: |
          if [ "$CHANGES" != success ]; then echo "the changes job: $CHANGES"; exit 1; fi
          if [ "$CODE" = false ]; then echo "the integration shards did not run: $WHY"; echo run=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$TOTAL" != success ]; then echo "counting the tests: $TOTAL"; exit 1; fi
          if [ "$SHARDS" != success ]; then echo "the integration shards: $SHARDS"; exit 1; fi
          echo run=true >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.decide.outputs.run == 'true'
      - uses: actions/download-artifact@v8
        if: steps.decide.outputs.run == 'true'
        with:
          pattern: integration-shard-*
          merge-multiple: true
          path: shards
      - if: steps.decide.outputs.run == 'true'
        run: bash test/check-shards.sh integration shards ${{ needs.integration-total.outputs.total }}

  # Each role as its own process, against Postgres, with real ffmpeg.
  roles:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash test/roles.sh "$RUNNER_TEMP/roles"
        env:
          JELLYSCALE_LOG_DIR: ${{ runner.temp }}/logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: roles-logs
          path: ${{ runner.temp }}/logs

  # On main, refill the e2e fixture cache when its key changed, so pull requests
  # and merge groups find it: a cache saved in a merge group is seen only there.
  # A hit restores and stops; a miss makes the films (minutes) and saves them.
  fixture-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      E2E_FIXTURE_CACHE: /home/runner/e2e-fixtures
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - id: fixtures
        run: echo "key=$(bash test/fixtures/key.sh)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: /home/runner/e2e-fixtures
          key: e2e-fixtures-${{ steps.fixtures.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash test/fixtures/cached.sh "$RUNNER_TEMP/fixtures"

  # Each shard is E2E_GATES and E2E_SHARD for test/e2e/run.sh. browse and play
  # are one sequence of steps, so they go to one job; subtitles and transcode are
  # dealt out by scenario. The transcode scenarios that stop the worker run last
  # on its last shard, after that shard's ordinary share, so it is likely the
  # longest; look there first if the e2e time grows.
  e2e-shard:
    name: e2e shard (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: browse-play-subtitles-0of2, gates: browse play subtitles, shard: 0/2 }
          - { name: subtitles-1of2, gates: subtitles, shard: 1/2 }
          - { name: transcode-0of3, gates: transcode, shard: 0/3 }
          - { name: transcode-1of3, gates: transcode, shard: 1/3 }
          - { name: transcode-2of3, gates: transcode, shard: 2/3 }
          # Not an e2e gate: the same stack of fixtures, asked by test/differential/run.sh.
          - { name: differential, gates: differential, shard: 0/1 }
    env:
      E2E_FIXTURE_CACHE: /home/runner/e2e-fixtures
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The films ffmpeg makes take minutes and are the same on every run, so
      # they are cached under the key test/fixtures/key.sh gives (the recipes and
      # ffmpeg's version), the same one test/e2e/run.sh looks them up by.
      - id: fixtures
        run: echo "key=$(bash test/fixtures/key.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: /home/runner/e2e-fixtures
          key: e2e-fixtures-${{ steps.fixtures.outputs.key }}
      - name: Fetch jellyfin-web from the baseline image
        run: |
          docker create --name jf jellyfin/jellyfin:12.4
          docker cp jf:/jellyfin/jellyfin-web web-dist
          docker rm jf
      - name: Install browser driver
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install playwright-core
      # Chrome, because fixtures are H.264 and AAC, which Chromium builds can omit.
      - if: matrix.name != 'differential'
        run: bash test/e2e/run.sh /tmp/e2e /tmp/pw
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          E2E_GATES: ${{ matrix.gates }}
          E2E_SHARD: ${{ matrix.shard }}
          JELLYSCALE_LOG_DIR: ${{ runner.temp }}/logs
      # The differential shard asks a real Jellyfin 12.4 and jellyscale the same
      # questions; it leaves a record like a gate's.
      - if: matrix.name == 'differential'
        run: bash test/differential/run.sh /tmp/differential
        env:
          JELLYSCALE_LOG_DIR: ${{ runner.temp }}/logs
      # What each gate of this shard ran: gate, shard, ran and total.
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.name }}
          path: ${{ runner.temp }}/logs/shard-*.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/logs

  # The required check "e2e". It passes when every shard passed and, for each
  # gate, they ran every scenario once between them, or when the shards did not
  # run (see changes).
  e2e:
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - id: decide
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WHY: ${{ needs.changes.outputs.why }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$CHANGES" != success ]; then echo "the changes job: $CHANGES"; exit 1; fi
          if [ "$CODE" = false ]; then echo "the e2e shards did not run: $WHY"; echo run=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$SHARDS" != success ]; then echo "the e2e shards: $SHARDS"; exit 1; fi
          echo run=true >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.decide.outputs.run == 'true'
      - uses: actions/download-artifact@v8
        if: steps.decide.outputs.run == 'true'
        with:
          pattern: e2e-shard-*
          merge-multiple: true
          path: shards
      - if: steps.decide.outputs.run == 'true'
        run: bash test/check-shards.sh e2e shards "browse play subtitles transcode differential"
