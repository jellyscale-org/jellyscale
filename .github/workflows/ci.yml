name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled, so adding ci:full to a pull request starts its full run.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue tests each pull request on top of main and what is queued
  # before it; the required checks must report there too.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Four checks are required by branch protection: lint-and-unit, integration,
# e2e and roles. Every job runs on ubuntu-24.04, pinned: its ffmpeg 6.1 is the
# oldest jellyscale supports, which ubuntu-latest would stop testing silently. They report on every pull request. integration and e2e are the last jobs
# of a fan-out: their shards (the "integration shard" and "e2e shard" jobs) run
# the tests side by side, and the job named integration or e2e fails if any shard
# failed or was cancelled, or if the shards did not add up to every test and
# scenario (test/check-shards.sh).
#
# The media tiers (the shards) run once per change, in the merge queue, which
# tests the exact commit that lands. A pull request runs lint-and-unit, and its
# integration and e2e checks pass at once saying so; the label ci:full runs the
# media tiers on the pull request too. A merge group or a ci:full pull request
# that changes only .claude/, tasks/ and Markdown in the root or docs/ skips them
# (test/changes.sh). A change with nothing outside tasks/ and that Markdown (a plan
# change) skips lint-and-unit too: the plan is not tested in CI (owner, 2026-11-22);
# the lead runs go test ./compat/ before pushing one. That is safe because the guard test (test/mediaguard, run by
# lint-and-unit) fails when any file outside those, but a short allowlist of unit tests and
# scripts, names .claude/ or tasks/. A push
# to main was tested in its merge group: it runs lint-and-unit and refills the
# e2e fixture cache, which only main's scope shares with every branch.
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      plan: ${{ steps.diff.outputs.plan }}
      why: ${{ steps.diff.outputs.why }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          code=true why="" kind=""
          case $GITHUB_EVENT_NAME in
          pull_request) kind=$(bash test/changes.sh "$PR_BASE...$PR_HEAD") ;;
          merge_group) kind=$(bash test/changes.sh "$QUEUE_BASE" "$QUEUE_HEAD") ;;
          esac
          case $GITHUB_EVENT_NAME in
          pull_request)
            if [ "$FULL" != true ]; then
              code=false why="a pull request: the media tiers run in the merge queue (label ci:full runs them here)"
            elif [ "$kind" != code ]; then
              code=false why="only .claude/, tasks/ and Markdown changed"
            fi ;;
          merge_group)
            if [ "$kind" != code ]; then
              code=false why="only .claude/, tasks/ and Markdown changed"
            fi ;;
          push) code=false why="a push to main, tested in its merge group" ;;
          esac
          # A plan change (tasks/ and Markdown, nothing under .claude/) is not tested at all (owner, 2026-11-22).
          plan=false
          [ "$kind" = plan ] && plan=true why="only tasks/ and Markdown changed: a plan change, which CI does not test"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "why=$why" >> "$GITHUB_OUTPUT"
          echo "media tiers: $code, plan change: $plan${why:+ ($why)}"

  leaks:
    # Every change, plan and Markdown included: credentials by gitleaks, and the owner's
    # private patterns (email, library paths, film titles) from the LEAK_PATTERNS secret.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Credentials
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 dir /repo --no-banner --redact
      - name: Private patterns
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT" in
          pull_request)
            if [ "$FORK" = "true" ]; then echo "A fork's pull request gets no secrets; the merge queue scans it."; exit 0; fi
            bash test/leaks.sh "$PR_BASE" "$PR_HEAD" ;;
          merge_group) bash test/leaks.sh "$QUEUE_BASE" "$QUEUE_HEAD" ;;
          *) bash test/leaks.sh ;;
          esac

  lint-and-unit:
    # Skipped for a plan change, which reports as passed; run whenever the changes
    # job failed or said nothing, so a broken classifier never skips the tests.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.plan != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal test)"
      - run: go vet ./...
      # The integration tier has a build tag; vet type-checks it and the second
      # command links its test binaries, so a tagged file can't rot unseen.
      - run: go vet -tags integration ./...
      - run: go test -tags integration -count=1 -run '^$' ./...
      - name: Tests that need nothing outside Go
        run: bash test/unit.sh
        env:
          JELLYSCALE_LOG_DIR: ${{ runner.temp }}/logs
      - name: Tests of the test scripts (shards, fixture cache, results)
        run: bash test/scripts_test.sh
      - name: Route manifest is current
        run: |
          go run ./cmd/jellyscale --print-routes > /tmp/endpoints.yaml
          diff compat/endpoints.yaml /tmp/endpoints.yaml
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

  # How many tests the integration tier has, from the compiler, for the job
  # that checks the shards ran them all.
  integration-total:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      total: ${{ steps.count.outputs.total }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: count
        run: echo "total=$(go test -tags integration -list '.*' ./... 2>/dev/null | grep -cE '^(Test|Example|Fuzz)')" >> "$GITHUB_OUTPUT"

  # Everything the integration tier needs is installed here, so a test that
  # can't run fails, and test/report.sh fails the job if any test is skipped.
  # internal/transcode and internal/api hold most of the time and are dealt out in four by test; the
  # fifth shard is every other package (test/shard.sh). A job runs its shard as `procs` go test
  # processes at once, each with a Postgres of its own (INTEGRATION_PROCS, test/integration.sh).
  integration-shard:
    name: integration shard (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # Above the tests' own limit of 45, set in test/integration.sh: the rest shard already takes 36-40 minutes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 0of4, shard: 0/4, procs: 2 }
          - { name: 1of4, shard: 1/4, procs: 2 }
          - { name: 2of4, shard: 2/4, procs: 2 }
          - { name: 3of4, shard: 3/4, procs: 2 }
          - { name: rest, shard: rest, procs: 4 }
    steps:
      - uses: actions/checkout@v7
        with:
          # The upgrade checks build the previous release from its commit
          # (image_burn_upgrade_integration_test.go).
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # ffmpeg from Ubuntu has libx264, libx265, libsvtav1 and libass; burn-in needs a font.
      # The .deb files of the install below, kept per runner image and package list: a hit installs
      # them with no mirror (test/apt.sh); a miss installs as always and saves them.
      - id: image
        run: echo "ImageVersion=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: /home/runner/apt-debs
          key: apt-debs-ffmpeg-fontconfig-fonts-dejavu-core-on-${{ steps.image.outputs.ImageVersion }}
          # A new runner image installs the last image's files rather than ask the mirror
          # (test/apt.sh falls back to the mirror if dpkg refuses them). The second key is the
          # cache main held before the key was reordered; remove it once main has saved a new one.
          restore-keys: |
            apt-debs-ffmpeg-fontconfig-fonts-dejavu-core-on-
            apt-debs-20261111.370.1-ffmpeg-fontconfig-fonts-dejavu-core
      - run: bash test/apt.sh ffmpeg fontconfig fonts-dejavu-core
        env:
          APT_DEBS: /home/runner/apt-debs
        timeout-minutes: 5 # A stalled mirror fails in minutes, not at the job's limit.
      - name: CI tests ffmpeg 6.1 on a known number of CPUs
        run: |
          nproc
          ffmpeg -version | head -1
          ffmpeg -version | head -1 | grep -q '^ffmpeg version 6\.1' || { echo 'CI must test ffmpeg 6.1, the oldest jellyscale supports'; exit 1; }
      - run: bash test/integration.sh
        env:
          INTEGRATION_SHARD: ${{ matrix.shard }}
          INTEGRATION_PROCS: ${{ matrix.procs }}
          JELLYSCALE_LOG_DIR: ${{ runner.temp }}/logs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-shard-${{ matrix.name }}
          # The test record too, pass or fail: test/shard-times.sh deals the shards
          # by the times in it, measured on CI's own runners.
          path: |
            ${{ runner.temp }}/logs/shard-*.txt
            ${{ runner.temp }}/logs/**/tests.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/logs

  # The required check "integration". It passes when every shard passed and
  # they ran every test between them, or when the shards did not run (see changes).
  integration:
    needs: [changes, integration-total, integration-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # For the shards' durations below.
    steps:
      - id: decide
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WHY: ${{ needs.changes.outputs.why }}
          TOTAL: ${{ needs.integration-total.result }}
          SHARDS: ${{ needs.integration-shard.result }}
        run: |
          if [ "$CHANGES" != success ]; then echo "the changes job: $CHANGES"; exit 1; fi
          if [ "$CODE" = false ]; then echo "the integration shards did not run: $WHY"; echo run=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$TOTAL" != success ]; then echo "counting the tests: $TOTAL"; exit 1; fi
          if [ "$SHARDS" != success ]; then echo "the integration shards: $SHARDS"; exit 1; fi
          echo run=true >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.decide.outputs.run == 'true'
      - uses: actions/download-artifact@v8
        if: steps.decide.outputs.run == 'true'
        with:
          pattern: integration-shard-*
          merge-multiple: true
          path: shards
      - if: steps.decide.outputs.run == 'true'
        run: bash test/check-shards.sh integration shards ${{ needs.integration-total.outputs.total }}
      # How long each shard took and how far apart they are: the slowest sets the
      # wall time, and a spread is what test/shard-times.txt should be refreshed for.
      - if: always() && steps.decide.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '
            .jobs[] | select(.name | startswith("integration shard (")) | select(.completed_at != null) |
            "\(.name) \((.completed_at | fromdate) - (.started_at | fromdate))"' |
            awk '{ printf "%s: %dm%02ds\n", $0 ~ /\(/ ? substr($0, 1, index($0, ")")) : $1, $NF / 60, $NF % 60; if (min == "" || $NF < min) min = $NF; if ($NF > max) max = $NF }
              END { printf "slowest shard %dm%02ds, fastest %dm%02ds, spread %dm%02ds\n", max / 60, max % 60, min / 60, min % 60, (max - min) / 60, (max - min) % 60 }' | tee -a "$GITHUB_STEP_SUMMARY"
      # The seconds of tests each shard ran, from its own tests.json (so not merged with the
      # others, which share the name), and a line to refresh the times when the dealt shards drift.
      # A notice: it fails nothing.
      - if: always() && steps.decide.outputs.run == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: integration-shard-*
          path: shard-logs
      - if: always() && steps.decide.outputs.run == 'true'
        continue-on-error: true
        run: bash test/shard-summary.sh shard-logs 0of4 1of4 2of4 3of4 rest | tee -a "$GITHUB_STEP_SUMMARY"

  # When lint-and-unit fails in a run whose media jobs run, they would go on for up to an hour
  # for a run that can't be merged: cancel the run. Only this run (its own id) is cancelled; the
  # check jobs integration and e2e still report, as failures, since their shards were cancelled.
  cancel-media-jobs:
    needs: [changes, lint-and-unit]
    if: always() && needs.lint-and-unit.result == 'failure' && needs.changes.outputs.code == 'true' && (github.event_name == 'merge_group' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "lint-and-unit failed, so the integration, e2e and roles jobs of run $GITHUB_RUN_ID are cancelled"
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  # Each role as its own process, against Postgres, with real ffmpeg.
  roles:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The .deb files of the install below, kept per runner image and package list: a hit installs
      # them with no mirror (test/apt.sh); a miss installs as always and saves them.
      - id: image
        run: echo "ImageVersion=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: /home/runner/apt-debs
          key: apt-debs-ffmpeg-on-${{ steps.image.outputs.ImageVersion }}
          # A new runner image installs the last image's files rather than ask the mirror
          # (test/apt.sh falls back to the mirror if dpkg refuses them). The second key is the
          # cache main held before the key was reordered; remove it once main has saved a new one.
          restore-keys: |
            apt-debs-ffmpeg-on-
            apt-debs-20261111.370.1-ffmpeg
      - run: bash test/apt.sh ffmpeg
        env:
          APT_DEBS: /home/runner/apt-debs
        timeout-minutes: 5 # A stalled mirror fails in minutes, not at the job's limit.
      - name: CI tests ffmpeg 6.1 on a known number of CPUs
        run: |
          nproc
          ffmpeg -version | head -1
          ffmpeg -version | head -1 | grep -q '^ffmpeg version 6\.1' || { echo 'CI must test ffmpeg 6.1, the oldest jellyscale supports'; exit 1; }
      - run: bash test/roles.sh "$RUNNER_TEMP/roles"
        env:
          JELLYSCALE_LOG_DIR: ${{ runner.temp }}/logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: roles-logs
          path: ${{ runner.temp }}/logs

  # On main, refill the e2e fixture cache when its key changed, so pull requests
  # and merge groups find it: a cache saved in a merge group is seen only there.
  # A hit restores and stops; a miss makes the films (minutes) and saves them.
  fixture-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_FIXTURE_CACHE: /home/runner/e2e-fixtures
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The .deb files of the install below, kept per runner image and package list: a hit installs
      # them with no mirror (test/apt.sh); a miss installs as always and saves them.
      - id: image
        run: echo "ImageVersion=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: /home/runner/apt-debs
          key: apt-debs-ffmpeg-on-${{ steps.image.outputs.ImageVersion }}
          # A new runner image installs the last image's files rather than ask the mirror
          # (test/apt.sh falls back to the mirror if dpkg refuses them). The second key is the
          # cache main held before the key was reordered; remove it once main has saved a new one.
          restore-keys: |
            apt-debs-ffmpeg-on-
            apt-debs-20261111.370.1-ffmpeg
      - run: bash test/apt.sh ffmpeg
        env:
          APT_DEBS: /home/runner/apt-debs
        timeout-minutes: 5 # A stalled mirror fails in minutes, not at the job's limit.
      - name: CI tests ffmpeg 6.1 on a known number of CPUs
        run: |
          nproc
          ffmpeg -version | head -1
          ffmpeg -version | head -1 | grep -q '^ffmpeg version 6\.1' || { echo 'CI must test ffmpeg 6.1, the oldest jellyscale supports'; exit 1; }
      - id: fixtures
        run: echo "key=$(bash test/fixtures/key.sh)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: /home/runner/e2e-fixtures
          key: e2e-fixtures-${{ steps.fixtures.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash test/fixtures/cached.sh "$RUNNER_TEMP/fixtures"

  # On main, save the .deb cache of the integration shards' package list and the jars of
  # the differential shard when their keys are missing: a cache saved in a merge group is
  # seen only there, and the differential shard never runs on main. (fixture-cache above
  # does the same for the ffmpeg list, which roles and the e2e shards use.)
  deb-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The .deb files of the install below, kept per runner image and package list: a hit installs
      # them with no mirror (test/apt.sh); a miss installs as always and saves them.
      - id: image
        run: echo "ImageVersion=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: /home/runner/apt-debs
          key: apt-debs-ffmpeg-fontconfig-fonts-dejavu-core-on-${{ steps.image.outputs.ImageVersion }}
          # A new runner image installs the last image's files rather than ask the mirror
          # (test/apt.sh falls back to the mirror if dpkg refuses them). The second key is the
          # cache main held before the key was reordered; remove it once main has saved a new one.
          restore-keys: |
            apt-debs-ffmpeg-fontconfig-fonts-dejavu-core-on-
            apt-debs-20261111.370.1-ffmpeg-fontconfig-fonts-dejavu-core
      - run: bash test/apt.sh ffmpeg fontconfig fonts-dejavu-core
        env:
          APT_DEBS: /home/runner/apt-debs
        timeout-minutes: 5 # A stalled mirror fails in minutes, not at the job's limit.

  jars-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/jellyscale/sdkjvm
          key: sdkjvm-jars-${{ hashFiles('test/sdkjvm/jars.txt') }}
      - run: bash test/sdkjvm/decode.sh --fetch

  # Each shard is E2E_GATES and E2E_SHARD for test/e2e/run.sh. browse and play
  # are one sequence of steps, so they go to one job; subtitles and transcode are
  # dealt out by scenario. The transcode scenarios that stop the worker run last
  # on its last shard, after that shard's ordinary share, so it is likely the
  # longest; look there first if the e2e time grows.
  e2e-shard:
    name: e2e shard (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: browse-play-subtitles-0of2, gates: browse play cors subtitles, shard: 0/2 }
          - { name: subtitles-1of2, gates: subtitles, shard: 1/2 }
          - { name: failover, gates: failover, shard: 0/1 }
          - { name: transcode-0of3, gates: transcode, shard: 0/3 }
          - { name: transcode-1of3, gates: transcode, shard: 1/3 }
          - { name: transcode-2of3, gates: transcode, shard: 2/3 }
          # Not an e2e gate: the same stack of fixtures, asked by test/differential/run.sh.
          - { name: differential, gates: differential, shard: 0/1 }
    env:
      E2E_FIXTURE_CACHE: /home/runner/e2e-fixtures
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The .deb files of the install below, kept per runner image and package list: a hit installs
      # them with no mirror (test/apt.sh); a miss installs as always and saves them.
      - id: image
        run: echo "ImageVersion=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: /home/runner/apt-debs
          key: apt-debs-ffmpeg-on-${{ steps.image.outputs.ImageVersion }}
          # A new runner image installs the last image's files rather than ask the mirror
          # (test/apt.sh falls back to the mirror if dpkg refuses them). The second key is the
          # cache main held before the key was reordered; remove it once main has saved a new one.
          restore-keys: |
            apt-debs-ffmpeg-on-
            apt-debs-20261111.370.1-ffmpeg
      - run: bash test/apt.sh ffmpeg
        env:
          APT_DEBS: /home/runner/apt-debs
        timeout-minutes: 5 # A stalled mirror fails in minutes, not at the job's limit.
      - name: CI tests ffmpeg 6.1 on a known number of CPUs
        run: |
          nproc
          ffmpeg -version | head -1
          ffmpeg -version | head -1 | grep -q '^ffmpeg version 6\.1' || { echo 'CI must test ffmpeg 6.1, the oldest jellyscale supports'; exit 1; }
      # The films ffmpeg makes take minutes and are the same on every run, so
      # they are cached under the key test/fixtures/key.sh gives (the recipes and
      # ffmpeg's version), the same one test/e2e/run.sh looks them up by.
      - id: fixtures
        run: echo "key=$(bash test/fixtures/key.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: /home/runner/e2e-fixtures
          key: e2e-fixtures-${{ steps.fixtures.outputs.key }}
      # The jars of the differential shard (test/sdkjvm/jars.txt): a changed list is a miss,
      # which fetches from Maven Central as before and saves.
      - if: matrix.name == 'differential'
        uses: actions/cache@v6
        with:
          path: ~/.cache/jellyscale/sdkjvm
          key: sdkjvm-jars-${{ hashFiles('test/sdkjvm/jars.txt') }}
      - name: Fetch jellyfin-web from the baseline image
        run: |
          docker create --name jf jellyfin/jellyfin:12.4
          docker cp jf:/jellyfin/jellyfin-web web-dist
          docker rm jf
      - name: Install browser driver
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install playwright-core@1.65.0
      # Chrome, because fixtures are H.264 and AAC, which Chromium builds can omit.
      - if: matrix.name != 'differential'
        run: bash test/e2e/run.sh /tmp/e2e /tmp/pw
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          E2E_GATES: ${{ matrix.gates }}
          E2E_SHARD: ${{ matrix.shard }}
          JELLYSCALE_LOG_DIR: ${{ runner.temp }}/logs
      # The differential shard asks a real Jellyfin 12.4 and jellyscale the same
      # questions; it leaves a record like a gate's.
      - if: matrix.name == 'differential'
        run: bash test/differential/run.sh /tmp/differential
        env:
          JELLYSCALE_LOG_DIR: ${{ runner.temp }}/logs
      # What each gate of this shard ran: gate, shard, ran and total.
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.name }}
          path: ${{ runner.temp }}/logs/shard-*.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/logs

  # The required check "e2e". It passes when every shard passed and, for each
  # gate, they ran every scenario once between them, or when the shards did not
  # run (see changes).
  e2e:
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: decide
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WHY: ${{ needs.changes.outputs.why }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$CHANGES" != success ]; then echo "the changes job: $CHANGES"; exit 1; fi
          if [ "$CODE" = false ]; then echo "the e2e shards did not run: $WHY"; echo run=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$SHARDS" != success ]; then echo "the e2e shards: $SHARDS"; exit 1; fi
          echo run=true >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.decide.outputs.run == 'true'
      - uses: actions/download-artifact@v8
        if: steps.decide.outputs.run == 'true'
        with:
          pattern: e2e-shard-*
          merge-multiple: true
          path: shards
      - if: steps.decide.outputs.run == 'true'
        run: bash test/check-shards.sh e2e shards "browse play cors subtitles failover transcode differential"
