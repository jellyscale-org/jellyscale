name: Image

# Publishes the server image and the fixtures image (docs/client-testing.md) to ghcr.io/jellyscale-org/jellyscale, once
# the images have passed their test. It runs on a push to main and on the push of a version tag, and on no pull request and
# no merge group, so it is not a required check and holds up no merge. It is one job, so that the images that are pushed
# are the very ones that were tested: the script that tests builds them and names them, and no step builds anything after
# it. The tags are the push script's alone (CONTRIBUTING.md says how a release is cut).
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

# One run per commit or tag at a time, and none is cancelled: a later push to main never replaces an earlier commit's image.
concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The films are made on the runner with the ffmpeg CI's other jobs use, and copied into the image.
      - run: bash test/apt.sh ffmpeg fontconfig fonts-dejavu-core
      - name: Build both images from this commit and test them
        env:
          JELLYSCALE_BUILT_AS: jellyscale-tested
        run: test/image.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the images that passed
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test/publish.sh ghcr.io/jellyscale-org/jellyscale jellyscale-tested:server jellyscale-tested:fixtures
