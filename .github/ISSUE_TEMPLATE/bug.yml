name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: jellyfin-web 12.4, Chrome 140
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options: [POSIX, S3-compatible, Both]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, keys and media paths you'd rather keep private.
      render: text
