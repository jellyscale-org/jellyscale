openapi: 3.1.0
info:
  title: jellyscale API
  version: 1.0.0
  description: The contract of jellyscale's own API. A client may use every operation whose state is preview; a declared
    one is not served yet. Reasons are added within a version, never removed or renamed.
paths:
  /jellyscale/v1/contract:
    get:
      operationId: getContract
      x-state: preview
      summary: This document, served to anyone.
      responses:
        "200":
          description: The contract the server holds, byte for byte as the repository and image carry it.
          x-reasons: []
          content:
            application/yaml:
              schema:
                type: string
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "500":
          $ref: '#/components/responses/ServerFailure'
  /jellyscale/v1/server:
    get:
      operationId: getServer
      x-state: preview
      summary: The server's identity, version and capabilities, for a client that has not signed in.
      responses:
        "200":
          description: Identity, including every capability and its state.
          x-reasons: []
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "500":
          $ref: '#/components/responses/ServerFailure'
  /jellyscale/v1/track-preferences:
    get:
      operationId: getTrackPreferences
      x-state: preview
      x-capability: track-preferences
      summary: The caller's own choices of which tracks to show.
      responses:
        "200":
          description: The stored choices.
          x-reasons: []
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPreferences'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "500":
          $ref: '#/components/responses/ServerFailure'
    patch:
      operationId: patchTrackPreferences
      x-state: preview
      x-capability: track-preferences
      summary: Change the fields of the caller's own choices that the body names.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackPreferencesPatch'
      responses:
        "200":
          description: The choices as stored.
          x-reasons: []
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPreferences'
        "400":
          $ref: '#/components/responses/InvalidBody'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/LanguageNotSaved'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "500":
          $ref: '#/components/responses/ServerFailure'
  /jellyscale/v1/users/configuration:
    patch:
      operationId: patchConfiguration
      x-state: preview
      x-capability: user-configuration
      summary: Change the fields of the caller's own configuration that the body names.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The configuration as stored.
          x-reasons: []
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        "400":
          $ref: '#/components/responses/InvalidBody'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "500":
          $ref: '#/components/responses/ServerFailure'
  /jellyscale/v1/items/{itemId}/playback-info:
    post:
      operationId: playbackInfo
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      x-state: preview
      x-capability: playback-info
      summary: How the caller's item can be played, with each track listed as itself.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The media sources, or a refusal in the body beside Jellyfin's ErrorCode.
          x-reasons: [no-capacity, not-found, nothing-to-play]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackInfo'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "400":
          $ref: '#/components/responses/InvalidBody'
        "404":
          $ref: '#/components/responses/NotFound'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "500":
          $ref: '#/components/responses/ServerFailure'
  /jellyscale/v1/sign-in:
    post:
      operationId: signIn
      x-state: declared
      x-capability: sign-in
      summary: Sign a device in with a name and password. Anyone may call it, with no token. Declared for Octave to build
        against; not served by this release.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            examples:
              livingRoomTv:
                value:
                  username: Alex
                  password: correct horse battery staple
                  deviceId: Yq3vN0b8Tz2xKpL4mW7rAe
                  deviceName: Living room TV
                  appName: Octave
              phone:
                value:
                  username: Sam
                  password: tulip lantern orbit seven
                  deviceId: 0f8b2c6e-4d71-4a9e-b3c5-7e1d9a2f6b40
                  deviceName: Sam's phone
                  appName: Octave
      responses:
        "200":
          description: Signed in. The token is given once, in this answer, and is sent on every later request.
          x-reasons: []
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignIn'
              examples:
                viewer:
                  value:
                    token: "9f2c4e1a7b3d48c6a0e5f1d2c3b4a596"
                    account: {id: "3c1e9a0f", name: "Alex", administrator: false}
                    profile: {id: "b7d24e61", name: "Alex"}
                    device: {id: "e05a8c2d", name: "Living room TV"}
                administrator:
                  value:
                    token: "41d7a2c9e0b84f3a9c6d5e2f1a0b7c83"
                    account: {id: "8a51f0c3", name: "Sam", administrator: true}
                    profile: {id: "2d9e7b14", name: "Sam"}
                    device: {id: "c6f3a28e", name: "Sam's phone"}
        "400":
          $ref: '#/components/responses/InvalidBody'
        "401":
          description: The name or the password is not right. The answer is the same for a name that is no account.
          x-reasons: [credentials-not-accepted]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
              examples:
                wrongPassword:
                  value: {reason: credentials-not-accepted, action: retry}
        "403":
          description: The account is turned off. Sent only after the right password, so it never tells a guesser that a
            name is an account.
          x-reasons: [account-off]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
              examples:
                accountOff:
                  value: {reason: account-off, action: ask-operator}
        "429":
          description: Too many wrong passwords. No password is checked until the time in Retry-After and
            retryAfterSeconds has passed, so the right one is refused too. scope says which bound refused it. The name
            bound counts a name that is no account exactly as an account, so `scope` name tells nothing about whether the
            name is one.
          x-reasons: [too-many-tries]
          headers:
            Retry-After:
              description: Whole seconds until a sign-in would no longer be refused, the same as retryAfterSeconds.
              schema:
                type: integer
                minimum: 1
                maximum: 900
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyTries'
              examples:
                device:
                  value: {reason: too-many-tries, action: retry, retryAfterSeconds: 840, scope: device}
        "404":
          $ref: '#/components/responses/NotServed'
        "500":
          $ref: '#/components/responses/ServerFailure'
  /jellyscale/v1/sign-out:
    post:
      operationId: signOut
      x-state: declared
      x-capability: sign-in
      summary: End the calling device's sign-in. Its token is refused afterwards. A signed-in device may call it. Declared
        for Octave to build against; not served by this release.
      security:
        - bearer: []
        - authorization: []
        - embyAuthorization: []
        - embyToken: []
        - mediaBrowserToken: []
        - apiKey: []
        - apiKeyLower: []
      responses:
        "204":
          description: Signed out. There is no body.
          x-reasons: []
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotServed'
        "500":
          $ref: '#/components/responses/ServerFailure'
  /jellyscale/v1/me:
    get:
      operationId: getMe
      x-state: declared
      x-capability: sign-in
      summary: The account, profile and device the caller's token belongs to. A signed-in device may call it; an app asks at
        launch whether its sign-in still holds. Declared for Octave to build against; not served by this release.
      security:
        - bearer: []
        - authorization: []
        - embyAuthorization: []
        - embyToken: []
        - mediaBrowserToken: []
        - apiKey: []
        - apiKeyLower: []
      responses:
        "200":
          description: Who is signed in on this device. It carries no token.
          x-reasons: []
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                viewer:
                  value:
                    account: {id: "3c1e9a0f", name: "Alex", administrator: false}
                    profile: {id: "b7d24e61", name: "Alex"}
                    device: {id: "e05a8c2d", name: "Living room TV"}
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotServed'
        "500":
          $ref: '#/components/responses/ServerFailure'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'The token sign-in gives, as `Authorization: Bearer <token>`.'
    authorization:
      type: apiKey
      in: header
      name: Authorization
      description: 'Jellyfin''s spelling, `Authorization: MediaBrowser Token="<token>", ...`, accepted beside Bearer.'
    embyAuthorization:
      type: apiKey
      in: header
      name: X-Emby-Authorization
      description: Jellyfin's older spelling, `MediaBrowser Token="<token>", ...`.
    embyToken:
      type: apiKey
      in: header
      name: X-Emby-Token
    mediaBrowserToken:
      type: apiKey
      in: header
      name: X-MediaBrowser-Token
    apiKey:
      type: apiKey
      in: query
      name: ApiKey
    apiKeyLower:
      type: apiKey
      in: query
      name: api_key
  responses:
    Unauthorized:
      description: No valid token. Sign in and try again.
      x-reasons: [unauthorized]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    Forbidden:
      description: The token may not act on what the request names.
      x-reasons: [forbidden]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    NotFound:
      description: No such item.
      x-reasons: [not-found]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    NotServed:
      description: A declared operation this server does not serve yet.
      x-reasons: [not-served]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    InvalidBody:
      description: The body is not one this operation accepts.
      x-reasons: [invalid-body]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    MethodNotAllowed:
      description: The path exists but takes another method; Allow names the ones it takes.
      x-reasons: [method-not-allowed]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    ServerFailure:
      description: Something inside the server failed; retry shortly.
      x-reasons: [server-failure]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    LanguageNotSaved:
      description: A switch needs a saved language first.
      x-reasons: [language-not-saved]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
  schemas:
    Refusal:
      type: object
      additionalProperties: false
      required: [reason, action]
      properties:
        reason:
          type: string
        action:
          type: string
          description: Words for what the viewer can do. A client that does not know a value keeps the string.
        detail:
          type: string
          description: What went wrong, for the app developer, not shown to the viewer. Its wording may change within a version;
            a client must not branch on it, and the server never writes it to a log.
    TooManyTries:
      type: object
      additionalProperties: false
      required: [reason, action, retryAfterSeconds, scope]
      properties:
        reason:
          type: string
          const: too-many-tries
        action:
          type: string
          description: Words for what the viewer can do. A client that does not know a value keeps the string.
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 900
          description: Whole seconds, rounded up, until a sign-in would no longer be refused.
        scope:
          type: string
          enum: [name, device, network]
          description: The bound that refused it. name, wrong passwords for this name from devices new to it; device, wrong
            passwords from this device; network, wrong passwords from this network.
        detail:
          type: string
          description: What went wrong, for the app developer, not shown to the viewer. Its wording may change within a version;
            a client must not branch on it, and the server never writes it to a log.
    SignInRequest:
      type: object
      additionalProperties: false
      required: [username, password, deviceId, deviceName, appName]
      properties:
        username:
          type: string
        password:
          type: string
        deviceId:
          type: string
          minLength: 22
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]+$'
          description: A random id the app makes once per installation, either 22 characters of random base64url
            or a random UUID, keeps private and sends on every sign-in from that installation, for every account
            signed in on it. It is never shown to the viewer. The server counts wrong passwords per known device by it, so a
            guesser who does not hold it and does not share the viewer's network address cannot keep the viewer out of a device
            that has signed in before, and a second
            sign-in with the same id replaces that device's token rather than adding a device, as each account holds one token
            per device. It is not the answer's `device.id`, which is the server's own id for the signed-in device.
        deviceName:
          type: string
          description: The name the viewer sees for this device in their list of devices.
        appName:
          type: string
    Account:
      type: object
      additionalProperties: false
      required: [id, name, administrator]
      properties:
        id:
          type: string
          description: Opaque; never the id of a profile or a device.
        name:
          type: string
        administrator:
          type: boolean
    Profile:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          description: Opaque; never the id of an account or a device.
        name:
          type: string
    Device:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          description: Opaque; never the id of an account or a profile.
        name:
          type: string
    SignIn:
      type: object
      additionalProperties: false
      required: [token, account, profile, device]
      properties:
        token:
          type: string
          description: 'Sent on every later request, as `Authorization: Bearer <token>` or a spelling Jellyfin''s clients
            use. Given once.'
        account:
          $ref: '#/components/schemas/Account'
        profile:
          $ref: '#/components/schemas/Profile'
        device:
          $ref: '#/components/schemas/Device'
    Me:
      type: object
      additionalProperties: false
      required: [account, profile, device]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        profile:
          $ref: '#/components/schemas/Profile'
        device:
          $ref: '#/components/schemas/Device'
    Capability:
      type: object
      additionalProperties: false
      required: [id, state]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [declared, preview, stable]
    Identity:
      type: object
      additionalProperties: false
      required: [name, id, version, apiVersion, capabilities]
      properties:
        name:
          type: string
        id:
          type: string
        version:
          type: string
        apiVersion:
          type: string
          const: v1
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
    TrackPreferences:
      type: object
      additionalProperties: false
      required: [HideOtherAudio, HideOtherSubtitles, KeepAudioLanguages, KeepSubtitleLanguages, ShowAllTracks]
      properties:
        HideOtherAudio:
          type: boolean
        HideOtherSubtitles:
          type: boolean
        KeepAudioLanguages:
          type: array
          items:
            type: string
        KeepSubtitleLanguages:
          type: array
          items:
            type: string
        ShowAllTracks:
          type: boolean
    TrackPreferencesPatch:
      type: object
      additionalProperties: false
      properties:
        HideOtherAudio:
          type: boolean
        HideOtherSubtitles:
          type: boolean
        KeepAudioLanguages:
          type: array
          items:
            type: string
        KeepSubtitleLanguages:
          type: array
          items:
            type: string
        ShowAllTracks:
          type: boolean
    Configuration:
      type: object
      properties:
        AudioLanguagePreference:
          type: string
        SubtitleLanguagePreference:
          type: string
        SubtitleMode:
          type: string
    MediaStream:
      type: object
      properties:
        Hidden:
          type: boolean
    MediaSource:
      type: object
      required: [MediaStreams]
      properties:
        MediaStreams:
          type: array
          items:
            $ref: '#/components/schemas/MediaStream'
    PlaybackInfo:
      type: object
      required: [MediaSources, PlaySessionId]
      properties:
        MediaSources:
          type: array
          items:
            $ref: '#/components/schemas/MediaSource'
        PlaySessionId:
          type: string
        ErrorCode:
          type: string
        reason:
          type: string
        action:
          type: string
x-capabilities:
  track-preferences:
    id: track-preferences
    state: preview
    x-retires-at-cutover: true
    meaning: A viewer hides tracks outside the languages they use, without changing the film.
  user-configuration:
    id: user-configuration
    state: preview
    x-retires-at-cutover: true
    meaning: A viewer saves the languages they listen and read in.
  playback-info:
    id: playback-info
    state: preview
    x-retires-at-cutover: true
    meaning: A viewer sees every track of a film marked as itself, with its own language.
  sign-in:
    id: sign-in
    state: declared
    meaning: A device signs in to jellyscale's own API; declared for clients to build against before it is served.
x-reasons:
  unauthorized:
    kind: refusal
    action: sign-in
    locked: true
    meaning: Please sign in before you do this.
  forbidden:
    kind: refusal
    action: none
    meaning: You are not allowed to use this for that title or account.
  not-found:
    kind: refusal
    action: none
    locked: true
    meaning: We could not find what you asked for.
  method-not-allowed:
    kind: refusal
    action: none
    locked: true
    meaning: This action cannot be used here.
  not-served:
    kind: refusal
    action: none
    meaning: This feature is not ready here yet.
  invalid-body:
    kind: refusal
    action: none
    meaning: What you sent could not be understood.
  language-not-saved:
    kind: refusal
    action: choose-another
    meaning: Choose your language first, then try again.
  no-capacity:
    kind: refusal
    action: retry
    meaning: This film cannot start right now; please try again in a moment.
  nothing-to-play:
    kind: refusal
    action: choose-another
    meaning: This show has no episode of its own to play here; choose an episode or a film.
  server-failure:
    kind: refusal
    action: retry
    locked: true
    meaning: Something went wrong here; please try again.
  credentials-not-accepted:
    kind: refusal
    action: retry
    meaning: The name or password isn't right. Check and try again.
  too-many-tries:
    kind: refusal
    action: retry
    meaning: Too many tries. Wait, then try again.
  account-off:
    kind: refusal
    action: ask-operator
    meaning: This account is turned off. Ask the operator to turn it on.
